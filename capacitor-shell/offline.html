<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — ITC NoteScan</title>
    <style>
      /* Static fallback page shown by Capacitor server.errorPath when the WebView
         cannot reach the remote app (e.g. airplane mode). No Capacitor plugins
         available here — plain HTML/CSS/JS only. */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { color-scheme: dark; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        background: #1b1b1b;
        color: #e7e7e7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 20rem; }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
      }
      .icon svg { width: 64px; height: 64px; }
      h1 { font-size: 1.15rem; font-weight: 600; color: #fff; margin-bottom: 8px; }
      p { font-size: 0.9rem; line-height: 1.5; color: #a4a4a4; margin-bottom: 24px; }
      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #008f95;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { background: #007a80; }
      .hint { margin-top: 16px; font-size: 0.75rem; color: #757575; }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Símbolo Mira (variante dark-bg — hex literais, exceção autorizada do DS
           para HTML estático fora do Tailwind). -->
      <div class="icon">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="#30A5AB">
            <rect x="4" y="4" width="22" height="8"></rect>
            <rect x="4" y="4" width="8" height="22"></rect>
            <rect x="38" y="4" width="22" height="8"></rect>
            <rect x="52" y="4" width="8" height="22"></rect>
            <rect x="4" y="52" width="22" height="8"></rect>
            <rect x="4" y="38" width="8" height="22"></rect>
            <rect x="38" y="52" width="22" height="8"></rect>
            <rect x="52" y="38" width="8" height="22"></rect>
          </g>
          <rect x="23" y="23" width="18" height="18" rx="3" fill="#F5F0E8"></rect>
        </svg>
      </div>
      <h1>Sem conexão</h1>
      <p>Não foi possível conectar ao ITC NoteScan. Verifique sua internet e tente novamente.</p>
      <button type="button" onclick="location.href='https://notescan.itcbr.xyz'">Tentar novamente</button>
      <p class="hint">Reconectaremos automaticamente assim que a internet voltar.</p>
    </div>
    <script>
      // Auto-retry as soon as connectivity is restored.
      window.addEventListener('online', function () {
        location.href = 'https://notescan.itcbr.xyz';
      });
    </script>
  </body>
</html>
