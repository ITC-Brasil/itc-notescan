name: Deploy

on:
  push:
    branches: [main]

# Deploys enfileiram; um deploy em andamento nunca é cancelado.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GLPI-SRV
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Formato "SHA256:<base64>"; divergência aborta antes do script.
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          # Default é 10m; margem de segurança para o build frio ocasional.
          command_timeout: 20m
          script: |
            set -e
            cd /home/glpissh/docker/notescan
            git pull --ff-only origin main
            docker compose up -d --build
            docker image prune -f --filter "label=com.itc.project=notescan"
