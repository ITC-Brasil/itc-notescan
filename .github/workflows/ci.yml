name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notescan
          POSTGRES_PASSWORD: notescan_dev
          POSTGRES_DB: notescan_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://notescan:notescan_dev@localhost:5432/notescan_test
      NEXTAUTH_SECRET: ci-test-secret-notescan
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder
      VAPID_PRIVATE_KEY: placeholder
      TELEGRAM_BOT_TOKEN: placeholder
      TELEGRAM_CHAT_ID: placeholder
      NEXT_PUBLIC_SENTRY_DSN: placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Security audit
        run: npm audit --audit-level=high

